name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test,research]'
      # The RXNFP integration test needs official weights downloaded locally and is
      # deselected here; every other test runs from the checkout alone.
      - name: Run tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
        run: python -m pytest -q -m 'not integration'

  report-integrity:
    name: report matches computed summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # REPORT.md must be derivable from summary.json: no metric may be hand-edited
      # into the technical note after the analysis ran.
      - name: Regenerate the technical note
        run: python scripts/write_consistency_report.py
      - name: Fail if the committed note differs
        run: git diff --exit-code -- outputs/encoder_consistency/REPORT.md
